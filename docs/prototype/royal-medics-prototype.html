<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Medics: Phase 1 design prototype</title>
<style>
:root{--brand:#17335b;--brand-d:#0f2447;--brand-l:#e8edf5;--ink:#0f1a2b;--mut:#6b7686;--line:#e6e8ec;--shell:#f4f4f5;--page:#e6e8ec;--ok:#1f7a45;--bad:#b42318;--ring:0 0 0 3px rgba(23,51,91,.28);--sh:0 2px 14px rgba(30,45,80,.06)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:92px}
a{color:var(--brand)}button,input,select,textarea{font:inherit}
h1,h2,h3{margin:0;letter-spacing:-.025em;color:var(--ink)}h1{font-size:2.2rem;line-height:1.12;font-weight:700}h2{font-size:1.3rem;font-weight:650}h3{font-size:1.05rem;font-weight:650}
:focus-visible{outline:none;box-shadow:var(--ring)}
.mut{color:var(--mut)}.small{font-size:.875rem}.price{color:var(--brand-d);font-weight:700}
.wrap{max-width:none;margin:0 auto;padding:0}

/* page frame */
#proto{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 14px;font-size:.82rem;color:#4b5a70;text-align:center}
#proto b{color:var(--ink)}
.seg{display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:var(--sh)}
.seg button{border:0;background:none;color:var(--brand);padding:0 18px;border-radius:999px;font-weight:600;cursor:pointer;min-height:44px}
.seg button.on{background:var(--brand);color:#fff}
.shell{max-width:1220px;margin:0 auto 24px;background:var(--shell);border-radius:40px;padding:26px 30px 30px;box-shadow:0 20px 50px rgba(30,45,80,.08),inset 0 1px 0 #fff}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}
.wordmark{font-size:1.8rem;letter-spacing:-.035em;color:var(--brand);cursor:pointer;font-weight:300;white-space:nowrap;line-height:1}.wordmark b{font-weight:800}
.wordmark em{font-style:normal;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-left:8px}
.pillnav{display:flex;gap:2px;background:#fff;border-radius:999px;padding:6px;box-shadow:var(--sh);overflow-x:auto;scrollbar-width:none}
.pillnav::-webkit-scrollbar{display:none}
.pillnav a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;color:var(--brand);font-weight:500;font-size:.95rem;white-space:nowrap;cursor:pointer;text-decoration:none}
.pillnav a:hover{background:var(--brand-l)}.pillnav a.on{background:var(--brand);color:#fff}
.tools{display:flex;align-items:center;gap:10px}
.circ{width:48px;height:48px;border-radius:50%;background:#fff;border:0;display:grid;place-items:center;color:var(--ink);box-shadow:var(--sh);cursor:pointer;position:relative}
.circ i{position:absolute;top:12px;right:13px;width:9px;height:9px;border-radius:50%;background:#e5484d;border:2px solid #fff}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#8ea3c4,#2b4f86);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.95rem;flex:0 0 auto}
.who{line-height:1.2;text-align:right;white-space:nowrap}
#anav a{padding:0 14px}
a.small,p.small a{display:inline-flex;align-items:center;min-height:44px}
.btn{white-space:nowrap}.who b{display:block}.who span{font-size:.85rem;color:var(--mut)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:0;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--brand-d)}.btn:disabled{background:#c6ccd8;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--brand);box-shadow:var(--sh)}.btn.ghost:hover{background:var(--brand-l)}
.btn.light{background:#fff;color:var(--brand)}.btn.light:hover{background:#eef1f6}
.btn.accent{background:var(--brand)}.btn.sm{min-height:38px;padding:0 16px;font-size:.88rem}
.field{display:block;margin-bottom:12px;font-weight:600;font-size:.92rem}
.field input,.field select,.field textarea{display:block;width:100%;margin-top:5px;min-height:48px;padding:8px 14px;border:1px solid #d6dbe4;border-radius:14px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:var(--ring);outline:none}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:.92rem}.chk input{width:22px;height:22px;margin-top:2px;flex:0 0 22px;accent-color:var(--brand)}

/* cards */
.card{background:#fff;border-radius:26px;padding:22px;box-shadow:var(--sh)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sel{background:#f1f2f5;border-radius:999px;padding:4px 12px;font-size:.78rem;color:var(--mut);font-weight:600}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.dash2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.dash3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,.9fr);gap:18px;align-items:start}
.hello h1{font-size:2.8rem;font-weight:600;letter-spacing:-.035em}.hello p{margin:4px 0 0;font-size:1.25rem;color:var(--mut)}
.feature{background:var(--brand);color:#fff}.feature h2,.feature p{color:#fff}.feature .eyebrow{color:#f0bcc2}.feature h2{font-size:1.7rem;margin:4px 0}.feature p{opacity:.88;margin:0 0 16px}
.eyebrow{margin:0;font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.tile{background:#fff;border:0;border-radius:22px;padding:14px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}.tile small{color:var(--mut)}.tile b{display:block;line-height:1.25}
.tile .gl{width:44px;height:44px;border-radius:14px;background:var(--brand-l);color:var(--brand);display:grid;place-items:center;align-self:flex-end}
.tile:nth-child(2) .gl{background:#efeaff;color:#5b3fc4}.tile:nth-child(3) .gl{background:#e3f4ee;color:#157a5b}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chip{flex:1 1 0;min-width:0;min-height:68px;border:0;border-radius:16px;background:#efeff1;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-size:.82rem}
.chip span{font-size:1.15rem;font-weight:700}.chip small{font-weight:500;color:var(--mut);font-size:.7rem}
.chip.on{background:var(--brand);color:#fff}.chip.on small{color:#cfd8e8}.chip:disabled{opacity:.45;cursor:not-allowed}
.li{display:flex;align-items:center;gap:12px;width:100%;background:#f4f4f6;border:1px solid #ececef;border-radius:999px;padding:8px 16px 8px 8px;margin-bottom:8px;text-align:left;cursor:pointer;color:var(--ink)}
.li:hover{background:#eef1f6;border-color:#d5dbe6}
.li .ico{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;flex:0 0 auto;font-size:.9rem;box-shadow:0 1px 3px rgba(30,45,80,.1)}
.li b{display:block;font-size:.92rem;line-height:1.2}.li small{color:var(--mut);font-size:.78rem}.li .r{margin-left:auto;font-size:.78rem;color:var(--mut);text-align:right;white-space:nowrap}
.appt{background:#f1f1f3;border-radius:18px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;margin-bottom:10px}
.appt .avatar{width:42px;height:42px;font-size:.8rem;grid-row:span 2}
.appt b{font-size:.92rem;line-height:1.2}.appt small{color:var(--mut)}
.appt .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:var(--mut);margin-top:6px}
.st{border-radius:8px;padding:3px 12px;font-size:.72rem;font-weight:700;color:#fff;display:inline-block}
.st.new{background:#9b1c2b}.st.conf{background:#2b4f86}.st.in{background:var(--ok)}.st.done{background:#8b93a0}.st.x{background:#c0392b}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat b{display:block;font-size:2rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}.stat{color:var(--mut);font-size:.88rem}.stat .card{padding:16px}
.chart{width:100%;height:auto;display:block}
.hrsrow{display:flex;justify-content:space-between;font-size:.93rem;padding:4px 0;color:var(--mut)}.hrsrow b{color:var(--ink);font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:8px;font-size:.74rem;font-weight:700;background:var(--brand-l);color:var(--brand-d)}
.pill.warn{background:#fdf0d5;color:#7a4a00}.pill.ok{background:#dff1e5;color:#17703a}.pill.bad{background:#fbe3e0;color:#a1281c}.pill.grey{background:#e8eaee;color:#47505f}
.alert{background:#fdf5e4;border-radius:16px;color:#5b3d06;padding:12px 16px;font-size:.92rem}
.note{background:#e9edf4;border-radius:16px;color:#22344f;padding:11px 16px;font-size:.84rem;margin:0 0 16px}
.hold{background:#e9edf4;border-radius:14px;padding:10px 14px;font-size:.9rem;margin-bottom:14px}
.sec{padding:0}.sec h1{margin-bottom:6px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tw{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--sh);font-size:.92rem}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}th{background:#f7f7f9;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}tr:last-child td{border-bottom:0}
details{background:#fff;border-radius:20px;padding:0 20px;margin-bottom:10px;box-shadow:var(--sh)}
summary{cursor:pointer;min-height:54px;display:flex;align-items:center;font-weight:650}details p{margin:0 0 14px;color:var(--mut)}

/* booking */
.steps{display:flex;gap:6px;margin:0 0 18px;padding:0;list-style:none}
.steps li{flex:1;text-align:center;font-size:.78rem;padding:9px 2px;border-radius:999px;background:#ebecef;color:var(--mut);font-weight:600}
.steps li.on{background:var(--brand);color:#fff}.steps li.done{background:var(--brand-l);color:var(--brand-d)}
.opt{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid transparent;border-radius:20px;padding:14px 18px;margin-bottom:10px;cursor:pointer;min-height:60px;box-shadow:var(--sh)}
.opt:hover{border-color:#c9d1e0}.opt.sel{border-color:var(--brand);background:#f2f4f8}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.day{flex:0 0 auto;min-width:82px;min-height:60px;border:0;background:#fff;border-radius:16px;font-weight:700;cursor:pointer;padding:6px;box-shadow:var(--sh);color:var(--ink)}
.day.sel{background:var(--brand);color:#fff}.day:disabled{opacity:.45;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{min-height:48px;border:0;background:#fff;border-radius:14px;font-weight:650;cursor:pointer;box-shadow:var(--sh);font-variant-numeric:tabular-nums;color:var(--ink)}
.slot:hover{background:#eef1f6}.slot.sel{background:var(--brand);color:#fff}
.ok-box{text-align:center;padding:28px}.tick{width:60px;height:60px;border-radius:50%;background:#dff1e5;color:var(--ok);display:grid;place-items:center;font-size:1.7rem;margin:0 auto 12px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0;text-align:left}dl.kv dt{color:var(--mut)}dl.kv dd{margin:0;font-weight:600}
.email{border-radius:20px;background:#fff;padding:16px 18px;font-size:.88rem;text-align:left;margin-top:14px;box-shadow:var(--sh)}
.hrs{display:grid;grid-template-columns:84px minmax(0,1fr) minmax(0,1fr) 54px;gap:6px;align-items:center;margin-bottom:8px}
.hrs input[type=time]{width:100%;min-width:0;min-height:44px;border:1px solid #d6dbe4;border-radius:12px;padding:0 6px}.hrs label{display:flex;gap:4px;align-items:center}
td input[type=number]{min-height:44px!important;border:1px solid #d6dbe4!important;border-radius:12px!important}

footer.site{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:.86rem}
footer.site p{margin:2px 0}footer.site a{display:inline-flex;align-items:center;min-height:44px;padding:0 8px 0 0;color:var(--mut)}
.mbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:55;display:none;grid-template-columns:1fr 1fr;gap:8px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-radius:999px;padding:7px;box-shadow:0 8px 28px rgba(30,45,80,.18)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0f1a2b;color:#fff;padding:12px 20px;border-radius:999px;z-index:90;display:none;max-width:92vw;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#admin{display:none}

@media(max-width:1000px){.dash3{grid-template-columns:1fr 1fr}.dash3>.col:nth-child(3){grid-column:1/-1}}
@media(max-width:860px){.dash2,.dash3{grid-template-columns:1fr}.hello h1{font-size:2.3rem}}
@media(max-width:799px){
  .mbar{display:grid}
  .shell{border-radius:30px;padding:16px 14px 24px;margin:0 8px 16px}
  .topbar{flex-wrap:wrap;margin-bottom:18px}
  .wordmark{font-size:1.55rem}
  .pillnav{order:3;flex:0 0 100%}
  .who{display:none}
}
@media(min-width:800px){body{padding-bottom:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ================= BRAND LAYER: navy, crimson, silver (from the logo) ================= */
:root{--brand:#17335b;--brand-d:#0f2447;--brand-l:#e8edf5;--red:#9b1c2b;--silver:#a9abb0;--page:#e6e8ec;--ring:0 0 0 3px rgba(23,51,91,.3);--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif}
html,body{background:var(--page)}
h1,.hello h1,.feature h2,.next h2{font-family:var(--serif)}
h1{font-weight:600;letter-spacing:-.01em}
.hello h1{font-size:2.7rem;line-height:1.1;font-weight:600}
.hello p.eyebrow{font-size:.74rem;margin:0 0 10px;color:var(--red)}
.hello p:not(.eyebrow){font-size:1.1rem;max-width:520px;margin:10px 0 0}
.eyebrow{color:var(--red);letter-spacing:.12em}
.lead{font-size:1.1rem;color:var(--mut);max-width:640px;margin:8px 0 0}
.feature{border-bottom:6px solid var(--red)}
.feature .eyebrow{color:#f0bcc2}
.feature h2{font-size:1.9rem}
.alert.red{background:#f8eaec;color:#6c1620;border:1px solid #efc9ce;border-radius:18px}
.st.new{background:var(--red)}.st.conf{background:#2b4f86}
.tile .gl{background:var(--brand-l);color:var(--brand)}
.tile:nth-child(2) .gl{background:#f8e8ea;color:var(--red)}
.tile:nth-child(3) .gl{background:#eceef2;color:#5a6372}
.avatar{background:linear-gradient(145deg,#8ea3c4,#2b4f86)}
.avatar.big{width:96px;height:96px;font-size:1.9rem;font-family:var(--serif);flex:0 0 auto}
.avatar.muted{background:#dfe2e8;color:#7a8394}
.card.doc{display:flex;gap:22px;align-items:flex-start}
.card.dim{display:flex;gap:16px;align-items:center;background:#fafafb;box-shadow:none;border:1px dashed #cfd4dc}
.card.dim .avatar.big{width:64px;height:64px;font-size:1.4rem}
.tags span{display:inline-block;background:var(--brand-l);color:var(--brand-d);border-radius:999px;padding:4px 12px;font-size:.8rem;margin:0 6px 6px 0;font-weight:600}
.ticks{list-style:none;padding:0;display:grid;gap:8px;color:var(--mut)}
.ticks li{padding-left:26px;position:relative}
.ticks li::before{content:"";position:absolute;left:3px;top:.45em;width:12px;height:7px;border-left:2px solid var(--brand);border-bottom:2px solid var(--brand);transform:rotate(-45deg)}
.how{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));counter-reset:s}
.how .card{counter-increment:s;position:relative;padding-top:56px}
.how .card::before{content:counter(s);position:absolute;left:20px;top:16px;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.9rem}
.lockup{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--brand)}
.lockup svg{height:48px;width:auto;flex:0 0 auto;display:block}
.lt{display:flex;flex-direction:column;line-height:1}
.r1{font-family:var(--serif);font-size:1.6rem;letter-spacing:.14em;font-weight:600;color:var(--brand)}
.r2{font-family:var(--serif);font-size:.84rem;letter-spacing:.44em;font-weight:600;color:var(--brand);margin-top:4px}
.lockup em{font-style:normal;font-family:-apple-system,"Segoe UI",sans-serif;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:700;margin-left:6px;align-self:flex-start;margin-top:4px}
footer.site{margin-top:34px;padding-top:22px;border-top:1px solid var(--line);color:var(--mut);font-size:.88rem}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.fgrid b{color:var(--ink);display:block;margin-bottom:4px}.fgrid p{margin:0}
footer.site .fine{margin:16px 0 0}
@media(max-width:1150px) and (min-width:800px){.pillnav a svg{display:none}.pillnav a{padding:0 14px}}
@media(max-width:799px){.lockup svg{height:40px}.r1{font-size:1.35rem}.r2{font-size:.72rem}.hello h1{font-size:2.2rem}.card.doc{flex-direction:column}}
/* ===== admin editing + banner ===== */
.banner{background:var(--red);color:#fff;border-radius:999px;padding:10px 20px;text-align:center;font-size:.92rem;font-weight:600;margin-bottom:16px}
.banner:empty{display:none}
.ti{width:100%;min-height:44px;border:1px solid #d6dbe4;border-radius:12px;padding:0 10px;background:#fff;min-width:80px}
.ti.sub{margin-top:6px;font-size:.84rem;color:var(--mut)}
td input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}
.edrow{margin-bottom:12px}
.edgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
#admin .topbar{flex-wrap:wrap}
#admin .pillnav{order:3;flex:0 0 100%}
/* ===== catalogue rails ===== */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.noscroll{overflow:hidden}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:18px 0 6px}
.chipbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chipbar::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:#fff;color:var(--brand);font-weight:600;cursor:pointer;box-shadow:var(--sh)}
.fchip.on{background:var(--brand);color:#fff}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:0 16px;min-height:48px;box-shadow:var(--sh);color:var(--mut);flex:1 1 260px;max-width:380px}
.search input{border:0;outline:none;background:none;flex:1;min-height:44px;min-width:0;font:inherit;color:var(--ink)}
.search:focus-within{box-shadow:var(--ring)}
.railsec{margin-top:26px}
.railhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.railbtns{display:flex;gap:8px}
.railbtns button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--brand);font-size:1.4rem;line-height:1;cursor:pointer;box-shadow:var(--sh)}
.railbtns button:hover{background:var(--brand-l)}
.railwrap{position:relative;margin:0 -30px}
.railwrap::after{content:"";position:absolute;top:0;right:0;bottom:12px;width:36px;background:linear-gradient(90deg,transparent,var(--shell));pointer-events:none}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 30px;padding:4px 30px 14px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.rail:focus-visible{box-shadow:none;outline:2px solid var(--brand);outline-offset:-2px;border-radius:12px}

.col .railwrap{margin:0 -22px}.col .rail-sm{padding-left:22px;padding-right:22px}

.pr{font-weight:700;color:var(--brand-d);white-space:nowrap}

.sheet{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet[hidden]{display:none}
.sheetbox{position:relative;background:#fff;width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:26px 24px 28px;max-height:88vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheetx{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:#f1f2f5;font-size:1.5rem;cursor:pointer;color:var(--ink)}

.arow .avatar{width:44px;height:44px;font-size:.85rem}

@media(max-width:799px){.railwrap{margin:0 -14px}.rail{padding:4px 14px 14px;scroll-padding:0 14px}.railbtns{display:none}.btn.sm{min-height:44px}.col .railwrap{margin:0 -14px}.col .rail-sm{padding-left:14px;padding-right:14px}}

/* ---------- booking wizard ---------- */
function slotsFor(sid,dateStr){
  const d=new Date(dateStr+'T00:00:00'),h=hours[d.getDay()];
  if(!h||closed[dateStr])return [];
  const s=svc(sid),out=[];
  const [sh,sm]=h[0].split(':').map(Number),[eh,em]=h[1].split(':').map(Number);
  for(let m=sh*60+sm;m+s.mins<=eh*60+em;m+=15){
    const t=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
    let free=true;for(let x=0;x<s.mins;x+=15){const mm=m+x;if(taken[dateStr+'|'+String(Math.floor(mm/60)).padStart(2,'0')+':'+String(mm%60).padStart(2,'0')])free=false}
    if(free&&!(dateStr===iso(today)&&m<=new Date().getHours()*60+new Date().getMinutes()+60))out.push(t)}
  return out}
function nextDays(){const a=[];for(let i=0;i<10;i++){const d=new Date(today);d.setDate(d.getDate()+i);a.push(d)}return a}
function stepsBar(n){return `<ol class="steps">${['Service','Time','Details','Confirm'].map((l,i)=>`<li class="${i+1<n?'done':i+1===n?'on':''}">${i+1}. ${l}</li>`).join('')}</ol>`}

  if(b.step===2){const days=nextDays();b.date=b.date||days.find(d=>slotsFor(b.sid,iso(d)).length)&&iso(days.find(d=>slotsFor(b.sid,iso(d)).length));
    const sl=b.date?slotsFor(b.sid,b.date):[];
    return `<section class="sec"><div class="wrap" style="max-width:640px"><h1>Book an appointment</h1>${stepsBar(2)}<p class="small"><a href="#" onclick="booking={step:1};go('book');return false">← Change service</a> · <b>${svc(b.sid).name}</b></p>
    <h2>Pick a time</h2><div class="days">${days.map(d=>{const k=iso(d),n=slotsFor(b.sid,k).length;return `<button class="day ${b.date===k?'sel':''}" ${n?'':'disabled style="opacity:.45"'} onclick="booking.date='${k}';booking.time=null;go('book')">${fmtDay(d)}<br><span class="small">${n?n+' free':'closed'}</span></button>`}).join('')}</div>
    <div class="slots">${sl.map(t=>`<button class="slot ${b.time===t?'sel':''}" onclick="booking.time='${t}';go('book')">${t}</button>`).join('')||'<p class="mut">No free times.</p>'}</div>
    <p style="margin-top:18px"><button class="btn" ${b.time?'':'disabled'} onclick="booking.step=3;booking.holdEnd=Date.now()+600000;go('book')">Continue</button></p></div></section>`}
  if(b.step===3){const s=svc(b.sid);return `<section class="sec"><div class="wrap" style="max-width:640px"><h1>Book an appointment</h1>${stepsBar(3)}
    <div class="hold">We are holding <b>${fmtDay(new Date(b.date+'T00:00:00'))} at ${b.time}</b> for you for <b id="cd">10:00</b>.</div>

    <button class="opt sel" id="payO" onclick="booking.pay='online';bindBook()"><span><b>Pay online now</b><br><span class="mut small">Card · Apple Pay · Google Pay (secured by Stripe)</span></span><span class="price">${euro(s.price)}</span></button>
    ${s.pay?`<button class="opt" id="payC" onclick="booking.pay='clinic';bindBook()"><span><b>Pay at the clinic</b><br><span class="mut small">Pay at reception when you arrive</span></span></button>`:''}
    <label class="chk"><input id="c1" type="checkbox"> I accept the terms</label>
    <label class="chk"><input id="c2" type="checkbox"> I agree the clinic may use my health information for this appointment</label>
    <label class="chk"><input id="c3" type="checkbox"> I accept the cancellation policy (free changes up to 24 hours before)</label>
    <p><button class="btn accent" onclick="confirmBooking()">Confirm booking</button></p></div></section>`}
  if(b.step===4){const s=svc(b.sid),d=new Date(b.date+'T00:00:00');return `<section class="sec"><div class="wrap" style="max-width:640px"><div class="card ok-box"><div class="tick">✓</div><h1>Your appointment is booked</h1>

    <p><button class="btn" onclick="go('manage')">Manage or cancel</button> <button class="btn ghost" onclick="toast('Downloads a calendar file (.ics) on the live site')">Add to calendar</button></p></div>
    <div class="email"><b>Email the patient receives instantly</b><br><span class="mut">Subject: Your appointment on ${fmtDay(d)} at ${b.time} is confirmed</span><p>Hello ${b.name}, your ${s.name} with ${D.name} is confirmed. Reference ${b.ref}. You can change or cancel free of charge up to 24 hours before using the link in this email. <u>Manage my appointment</u> · <u>Add to calendar</u></p><p class="mut small" style="margin:0">Health answers are never included in emails. Reminders are sent 24 hours and 2 hours before.</p></div>
    <p class="note" style="margin-top:14px">Now switch to <b>Clinic admin → Appointments</b>: this booking is already there, and the time has gone from the public page.</p></div></section>`}
}
function bindBook(){
  if(booking.step!==3)return;
  booking.pay=booking.pay||'online';
  const o=$('#payO'),c=$('#payC');o&&o.classList.toggle('sel',booking.pay==='online');c&&c.classList.toggle('sel',booking.pay==='clinic');
  clearInterval(window._cd);window._cd=setInterval(()=>{const e=$('#cd');if(!e)return clearInterval(window._cd);const left=Math.max(0,Math.floor((booking.holdEnd-Date.now())/1000));e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')},500)}
function confirmBooking(){
  if(!($('#c1').checked&&$('#c2').checked&&$('#c3').checked))return toast('Please tick the three required boxes to continue.');
  const b=booking,s=svc(b.sid);b.name=$('#fn').value+' '+$('#ln').value;b.ref='RMC-'+Math.random().toString(36).slice(2,8).toUpperCase();
  for(let x=0;x<s.mins;x+=15){const m=parseInt(b.time)*60+parseInt(b.time.split(':')[1])+x;taken[b.date+'|'+String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')]=true}
  appts.push({ref:b.ref,date:b.date,time:b.time,name:b.name,s:b.sid,paid:b.pay==='online'?'paid':'unpaid',status:'confirmed',online:true});
  b.step=4;go('book')}

 pkg:{arr:()=>PKG,cols:[{k:'n',l:'Name'},{k:'d',l:'What it includes'},{k:'p',l:'Price text (for example From €150)'}]}};
const IMGLISTS={cats:'cat',other:'other',pkg:'pkg'};
function listEd(n){const L=LISTS[n],kind=IMGLISTS[n];
  const rows=L.arr().map((it,i)=>`<div class="card edrow">${kind?imgCtl(kind,i,it):''}<div class="edgrid">${L.cols.map(c=>{const v=c.list?(it[c.k]||[]).join(' | '):(it[c.k]||'');return `<label class="field">${c.l}${c.ta?`<textarea rows="3" onchange="lsSet('${n}',${i},'${c.k}',this.value,${c.list?1:0})">${v}</textarea>`:`<input value="${v}" onchange="lsSet('${n}',${i},'${c.k}',this.value,${c.list?1:0})">`}</label>`}).join('')}</div><button class="btn ghost sm" onclick="lsDel('${n}',${i})">Delete</button></div>`).join('');
  const add=`<div class="card edrow" style="border:1px dashed #cfd4dc;box-shadow:none"><b>Add new</b>${kind?pendCtl(kind):''}<div class="edgrid">${L.cols.map(c=>`<label class="field">${c.l}${c.ta?`<textarea id="add-${n}-${c.k}" rows="3"></textarea>`:`<input id="add-${n}-${c.k}">`}</label>`).join('')}</div><button class="btn sm" onclick="lsAdd('${n}')">Add</button></div>`;
  return rows+add}
const lsVal=(c,v)=>c.list?v.split('|').map(x=>esc(x.trim())).filter(Boolean):esc(v.trim());
function lsSet(n,i,k,v,list){const c=LISTS[n].cols.find(x=>x.k===k);LISTS[n].arr()[i][k]=lsVal(c,v);saved()}
function lsDel(n,i){LISTS[n].arr().splice(i,1);keepAdm();toast('Deleted. Removed from the website.')}
function lsAdd(n){const L=LISTS[n],o={},kind=IMGLISTS[n];let any=false;L.cols.forEach(c=>{const v=document.getElementById('add-'+n+'-'+c.k).value;if(v.trim())any=true;o[c.k]=lsVal(c,v)});if(!any)return toast('Please fill in at least one field.');if(kind){o.art={cat:'steth',other:'clip',pkg:'box'}[kind];if(pend[kind])o.img=pend[kind];pend[kind]=null}L.arr().push(o);keepAdm();toast('Added. It is on the website now.')}
function galUp(){pickImage(u=>{if(!u)return;GALLERY.push({img:u,cap:''});keepAdm();toast('Photo added to the About page.')},true)}
function galCap(i,v){GALLERY[i].cap=esc(v.trim());saved()}
function galDel(i){GALLERY.splice(i,1);keepAdm();toast('Photo removed.')}
function heroUp(){pickImage(u=>{if(!u)return;CONTENT.heroImg=u;keepAdm();toast('Home page photo saved.')})}
function heroRm(){CONTENT.heroImg='';keepAdm();toast('Home page photo removed.')}
function galUp(){pickImage(u=>{if(!u)return;GALLERY.push({img:u,cap:''});keepAdm();toast('Photo added to the About page.')},true)}
function galCap(i,v){GALLERY[i].cap=esc(v.trim());saved()}
function galDel(i){GALLERY.splice(i,1);keepAdm();toast('Photo removed.')}
function heroUp(){pickImage(u=>{if(!u)return;CONTENT.heroImg=u;keepAdm();toast('Home page photo saved.')})}
function heroRm(){CONTENT.heroImg='';keepAdm();toast('Home page photo removed.')}
function aWeb(){return `<h1>Website content</h1><p class="note">Edit every page of the website here, including photos. Nothing needs a developer.</p>
<div class="card edrow"><h3>Announcement banner</h3><p class="mut small">Shown at the top of every page. Use it for holiday hours or news.</p><label class="chk"><input id="bn-on" type="checkbox" ${CONTENT.banner.on?'checked':''}> Show the banner</label><label class="field">Text<input id="bn-text" value="${CONTENT.banner.text}"></label><button class="btn sm" onclick="CONTENT.banner={on:document.getElementById('bn-on').checked,text:esc(gv('bn-text'))};saved()">Save banner</button></div>
<div class="card edrow"><h3>Home page</h3><div class="imgctl">${CONTENT.heroImg?`<img class="pthumb" src="${CONTENT.heroImg}" alt="">`:''}<button class="btn ghost sm" onclick="heroUp()">${CONTENT.heroImg?'Change home photo':'Add a home page photo'}</button>${CONTENT.heroImg?'<button class="btn ghost sm" onclick="heroRm()">Remove photo</button>':''}</div><label class="field">Headline<input id="hp-t" value="${CONTENT.heroTitle}"></label><label class="field">Introduction<textarea id="hp-i" rows="2">${CONTENT.heroIntro}</textarea></label><button class="btn sm" onclick="CONTENT.heroTitle=esc(gv('hp-t'));CONTENT.heroIntro=esc(gv('hp-i'));saved()">Save home page</button></div>
<div class="card edrow"><h3>About page</h3><label class="field">Our story (leave a blank line between paragraphs)<textarea id="ab-s" rows="8">${CONTENT.about}</textarea></label><button class="btn sm" onclick="CONTENT.about=esc(document.getElementById('ab-s').value.trim());saved()">Save About page</button></div>
<div class="card edrow"><h3>Clinic photo gallery</h3><p class="mut small">Photos shown on the About page. You can add several at once.</p><div class="gallery">${GALLERY.map((g,i)=>`<figure><img src="${g.img}" alt=""><figcaption><input class="ti" aria-label="Caption" placeholder="Caption" value="${g.cap}" onchange="galCap(${i},this.value)"><button class="btn ghost sm" style="margin-top:6px" onclick="galDel(${i})">Remove</button></figcaption></figure>`).join('')}</div><button class="btn sm" style="margin-top:12px" onclick="galUp()">Add photos</button></div>
<div class="card edrow"><h3>Doctors page</h3><label class="chk"><input type="checkbox" ${CONTENT.soon?'checked':''} onchange="CONTENT.soon=this.checked;saved()"> Show the "more doctors joining soon" cards</label></div>
<h2 style="margin:24px 0 12px">Frequently asked questions</h2>${listEd('faq')}
<h2 style="margin:24px 0 12px">Service categories (Services page)</h2>${listEd('cats')}
<h2 style="margin:24px 0 12px">Other services (Prices page)</h2>${listEd('other')}
<h2 style="margin:24px 0 12px">Screening packages (Prices page)</h2>${listEd('pkg')}`}
/* ----- clinic details ----- */
function aClinic(){return `<h1>Clinic details</h1><p class="note">Used on the Contact page, the footer, emails and the home page.</p><div class="card edrow" style="max-width:680px"><label class="field">Clinic name<input id="cl-n" value="${CLINIC.legal}"></label><label class="field">Address line 1<input id="cl-a1" value="${CLINIC.addr1}"></label><label class="field">Address line 2<input id="cl-a2" value="${CLINIC.addr2}"></label><div class="edgrid"><label class="field">Eircode<input id="cl-ec" value="${CLINIC.eircode}"></label><label class="field">Email<input id="cl-em" type="email" value="${CLINIC.email}"></label><label class="field">Phone 1<input id="cl-p1" value="${CLINIC.phones[0]||''}"></label><label class="field">Phone 2<input id="cl-p2" value="${CLINIC.phones[1]||''}"></label></div><button class="btn" onclick="CLINIC.legal=esc(gv('cl-n'));CLINIC.addr1=esc(gv('cl-a1'));CLINIC.addr2=esc(gv('cl-a2'));CLINIC.eircode=esc(gv('cl-ec'));CLINIC.email=esc(gv('cl-em'));CLINIC.phones=[gv('cl-p1'),gv('cl-p2')].filter(Boolean).map(esc);saved()">Save clinic details</button></div>`}
const sn=a=>svc(a.s).name;
function pill(a){return a.status==='cancelled'?'<span class="pill bad">cancelled</span>':a.status==='checked in'?'<span class="pill ok">checked in</span>':a.status==='completed'?'<span class="pill grey">completed</span>':'<span class="pill">confirmed</span>'}
function payPill(a){return a.paid==='paid'?'<span class="pill ok">paid</span>':'<span class="pill warn">unpaid</span>'}
function stBadge(a){if(a.status==='cancelled')return '<span class="st x">Cancelled</span>';if(a.status==='completed')return '<span class="st done">Completed</span>';if(a.status==='checked in')return '<span class="st in">Checked in</span>';return a.online?'<span class="st new">New</span>':'<span class="st conf">Confirmed</span>'}
function chartSvg(vals,labels){
  const W=340,H=150,pl=8,pr=8,pt=12,pb=26,max=Math.max(4,...vals)+1,n=vals.length;
  const x=i=>pl+i*(W-pl-pr)/(n-1),y=v=>pt+(H-pt-pb)*(1-v/max);
  let d=`M${x(0)},${y(vals[0])}`;for(let i=1;i<n;i++){const mx=(x(i-1)+x(i))/2;d+=` C${mx},${y(vals[i-1])} ${mx},${y(vals[i])} ${x(i)},${y(vals[i])}`}
  const grid=[0,.5,1].map(f=>{const v=max*f,yy=y(v);return `<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#dfe3ea" stroke-dasharray="4 4"/>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Appointments per day for the next 7 days: ${vals.join(', ')}"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#17335b" stop-opacity=".22"/><stop offset="1" stop-color="#17335b" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${d} L${x(n-1)},${y(0)} L${x(0)},${y(0)} Z" fill="url(#g)"/><path d="${d}" fill="none" stroke="#17335b" stroke-width="2.5" stroke-linecap="round"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#fff" stroke="#17335b" stroke-width="2"/>`).join('')}${labels.map((l,i)=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#6b7686">${l}</text>`).join('')}</svg>`}
function aDash(){
  const days=nextDays().slice(0,7),N=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const live=a=>a.status!=='cancelled';
  const sel=window._sd&&days.map(iso).includes(window._sd)?window._sd:iso(days.find(d=>appts.some(a=>a.date===iso(d)))||days[0]);window._sd=sel;
  const cnt=days.map(d=>appts.filter(a=>a.date===iso(d)&&live(a)).length);
  const collect=appts.filter(a=>a.paid==='unpaid'&&live(a)),paid=appts.filter(a=>a.paid==='paid').reduce((n,a)=>n+svc(a.s).price,0);
  const day=appts.filter(a=>a.date===sel).sort(cmp),show=day.slice(0,4);
  const month=new Date(sel+'T00:00:00').toLocaleDateString('en-IE',{month:'short'});
  return `<div class="dash3">
  <div class="col"><div class="hello"><h1>Hello, Dr Khalid!</h1><p>Here is the clinic today.</p></div>
   <div class="mini stat"><div class="card"><b>${appts.filter(a=>live(a)&&a.status!=='completed').length}</b>upcoming</div><div class="card"><b>${collect.length}</b>to collect</div><div class="card"><b>${euro(paid)}</b>paid so far</div><div class="card"><b>${appts.filter(a=>a.online).length}</b>booked online</div></div>
   <p class="note" style="margin:0">Sample clinic day. This is what reception and the doctor see.</p></div>
  <div class="col"><div class="card"><div class="cardhead"><h3>Appointments this week</h3><span class="sel">Next 7 days</span></div>${chartSvg(cnt,days.map(d=>N[d.getDay()]))}</div>
   <div class="card"><div class="cardhead"><h3>To collect</h3><span class="sel">${collect.length} unpaid</span></div>${collect.slice(0,4).map(a=>`<div class="li" style="cursor:default"><span class="ico">${initials(a.name)}</span><span><b>${a.name}</b><small>${sn(a)} · ${fmtDay(new Date(a.date+'T00:00:00'))} ${a.time}</small></span><button class="btn ghost sm" style="margin-left:auto" onclick="act('${a.ref}','pay')">Mark paid</button></div>`).join('')||'<p class="mut" style="margin:0">Nothing to collect.</p>'}</div></div>
  <div class="col"><div class="card"><div class="cardhead"><h3>My schedule</h3><span class="sel">${month}</span></div>
   <div class="chips">${days.slice(0,5).map(d=>{const k=iso(d);return `<button class="chip ${k===sel?'on':''}" onclick="window._sd='${k}';adm('dash')">${N[d.getDay()]}<span>${d.getDate()}</span></button>`}).join('')}</div>
   ${show.map(a=>`<div class="appt"><span class="avatar">${initials(a.name)}</span><b>${a.name}</b><small>${sn(a)}</small><div class="foot"><span>${fmtDay(new Date(a.date+'T00:00:00'))}, ${a.time}</span>${stBadge(a)}</div></div>`).join('')||'<p class="mut">No appointments this day.</p>'}
   ${day.length>4?`<p style="margin:4px 0 0"><a class="small" href="#" onclick="adm('appts');return false">View all ${day.length}</a></p>`:''}</div></div></div>`}
const cmp=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);
function tbl(list){return `<div class="alist">${list.map(a=>`<div class="arow"><span class="avatar" aria-hidden="true">${initials(a.name)}</span><div class="amain"><b>${a.name}${a.online?' <span class="pill grey">online</span>':''}</b><small>${a.ref} · ${sn(a)}</small></div><div class="awhen"><b>${a.time}</b><small>${fmtDay(new Date(a.date+'T00:00:00'))}</small></div><div class="abadges">${stBadge(a)}${payPill(a)}</div><div class="aact">${a.status==='confirmed'?`<button class="btn ghost sm" onclick="act('${a.ref}','in')">Check in</button>`:''}${a.status==='checked in'?`<button class="btn sm" onclick="act('${a.ref}','done')">Complete</button>`:''}${a.paid==='unpaid'&&a.status!=='cancelled'?`<button class="btn ghost sm" onclick="act('${a.ref}','pay')">Mark paid</button>`:''}</div></div>`).join('')||'<p class="mut">Nothing here.</p>'}</div>`}
function act(ref,w){const a=appts.find(x=>x.ref===ref);if(w==='in')a.status='checked in';if(w==='done')a.status='completed';if(w==='pay'){a.paid='paid';toast('Marked paid. A receipt number is issued.')}adm(window._a)}
function aAppts(){return `<h1>Appointments</h1><p class="note">Every online booking appears here the moment it is made. Staff can check in, complete, take payment and cancel.</p>${tbl(appts.slice().sort(cmp))}`}
function aWalk(){const days=nextDays();return `<h1>Walk-in and phone booking</h1><p class="note">Uses the same rules as online booking, so a time can never be booked twice.</p><div class="card" style="max-width:520px"><label class="field">Service<select id="ws">${bookable().map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></label><label class="field">Day<select id="wd">${days.map(d=>`<option value="${iso(d)}">${fmtDay(d)}</option>`).join('')}</select></label><label class="field">Time (HH:MM)<input id="wt" value="09:30"></label><label class="field">Patient name<input id="wn" value="Walk-in patient"></label><button class="btn" onclick="walkIn()">Book</button></div>`}
function walkIn(){const sid=$('#ws').value,d=$('#wd').value,t=$('#wt').value.trim();if(!slotsFor(sid,d).includes(t))return toast('Sorry, that time is taken or outside opening hours.');
  const s=svc(sid);for(let x=0;x<s.mins;x+=15){const m=parseInt(t)*60+parseInt(t.split(':')[1])+x;taken[d+'|'+String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')]=true}
  appts.push({ref:'RMC-W'+Math.floor(Math.random()*900+100),date:d,time:t,name:$('#wn').value,s:sid,paid:'unpaid',status:'confirmed'});toast('Booked. That time is now blocked on the public site.');adm('appts')}
function aHours(){const N=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];return `<h1>Doctor hours</h1><p class="note">Set ${D.name}'s weekly hours. Patients only ever see free times inside these hours.</p><div class="card" style="max-width:560px">${[1,2,3,4,5,6,0].map(i=>`<div class="hrs"><b>${N[i]}</b><input type="time" value="${hours[i]?hours[i][0]:''}" onchange="setH(${i},0,this.value)"><input type="time" value="${hours[i]?hours[i][1]:''}" onchange="setH(${i},1,this.value)"><label class="small"><input type="checkbox" ${hours[i]?'':'checked'} onchange="offDay(${i},this.checked)"> off</label></div>`).join('')}</div>`}
function setH(i,j,v){hours[i]=hours[i]||['08:00','18:00'];hours[i][j]=v;toast('Saved')}
function offDay(i,off){hours[i]=off?null:['08:00','18:00'];adm('hours')}
function aClosed(){const days=nextDays();return `<h1>Closed days</h1><p class="note">Irish public holidays are added automatically. Add your own (training day, holiday), and those days disappear from the booking page.</p><div class="card" style="max-width:520px"><label class="field">Date<select id="cd1">${days.map(d=>`<option value="${iso(d)}">${fmtDay(d)}</option>`).join('')}</select></label><label class="field">Reason<input id="cr" value="Staff training day"></label><button class="btn" onclick="closeDay()">Add closed day</button></div><br><div class="tw"><table><tr><th>Date</th><th>Reason</th><th></th></tr>${Object.entries(closed).map(([k,v])=>`<tr><td>${fmtDay(new Date(k+'T00:00:00'))}</td><td>${v}</td><td><button class="btn ghost sm" onclick="delete closed['${k}'];adm('closed')">Remove</button></td></tr>`).join('')||'<tr><td colspan="3" class="mut">No closed days added.</td></tr>'}</table></div>`}
function closeDay(){closed[$('#cd1').value]=$('#cr').value;toast('Added. That day is now unavailable for booking.');adm('closed')}

setView('patient');
</script>
